# DEV ONLY. Mosquitto 2.x refuses connections from outside the container
# unless a listener is declared, and refuses anonymous clients by default.
# Before a real deployment: add a password file (or TLS) and set
# allow_anonymous false.

listener 1883
allow_anonymous true
log_dest stdout

# The detection service keeps a persistent session (mqtt.service_client_id in
# config.yaml), so uplinks published while it is down are queued here and
# delivered when it reconnects. Persistence keeps that queue (and the session)
# across a broker restart; it is saved to the mosquitto-data volume.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# Default is 1000 per client: about 30 minutes of heartbeats at 300 nodes.
# 100 000 covers several days.
max_queued_messages 100000
# Forget a client that has not been back for a week (and its queue).
persistent_client_expiration 7d
