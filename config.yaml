console:
  title: "BKASSINE CIVIL DEFENCE CENTRE"
  subtitle: "Forest fire early-warning and suppression - operator console"
  map:
    # Bkassine forest, Jezzine district, Lebanon.
    # centre_lat/lon are derived from demo_layout.centre.
    show_nodes_in_overview: true
    zoom: 15
    # Demo grid detail begins at max(node_detail_zoom, 18), capped by tile
    # max zoom. Every grid node is individual there; overview shows a network
    # summary and unclustered alarms. show_nodes_in_overview is retained for
    # config compatibility; the current frontend uses zoom-dependent layers.
    # Without demo_layout, node_detail_zoom enables ordinary node clustering.
    # Must be greater than zoom.
    node_detail_zoom: 17
    cluster_radius_px: 50
    # Sensor coverage radius, not fire extent. Demo mode exposes this as an
    # optional muted coverage layer, separate from the 15 m alarm highlights.
    # Non-demo layouts retain the legacy red coverage visualization.
    alarm_zone_radius_m: 150
    # No API key needed. Both need internet; without it the markers and
    # alarm zones still draw, on a blank background. Check each provider's
    # terms of use before production use.
    primary_tiles:
      # Enlarge these tiles at closer zooms instead of requesting missing imagery.
      max_native_zoom: 17
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics, GIS User Community"
      max_zoom: 19
    fallback_tiles:
      url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      attribution: "&copy; OpenStreetMap contributors"
      max_zoom: 19
  # Later project phases. While false, the panel is shown greyed and labelled
  # "NOT CONNECTED - PLANNED PHASE 2", with no data. Turning one on only
  # reveals "enabled, no data source configured" until an integration exists.
  features:
    thermal_camera: false
    drone: false
    wind_station: false
    # Demo: on a fire alarm, show a SIMULATED drone dispatch from its base.
    drone_simulation: true
